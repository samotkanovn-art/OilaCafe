<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oila — ресторан в Ташкенте</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #f5f0e8;
    --dark: #1a1208;
    --terracotta: #c4622d;
    --gold: #b8933a;
    --warm-mid: #7a5c3a;
    --soft: #e8dece;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background-color: var(--dark);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Jost', sans-serif;
    overflow-x: hidden;
  }

  /* Background texture */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 50% 0%, #3a2010 0%, transparent 70%),
      radial-gradient(ellipse 50% 40% at 80% 100%, #2a1a08 0%, transparent 60%);
    pointer-events: none;
  }

  /* Grain overlay */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    opacity: 0.4;
    pointer-events: none;
  }

  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    padding: 48px 28px 52px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }

  /* Ornament top */
  .ornament {
    width: 120px;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin-bottom: 32px;
    opacity: 0;
    animation: fadeUp 0.8s ease 0.1s forwards;
  }

  /* Logo area */
  .logo-wrap {
    text-align: center;
    margin-bottom: 10px;
    opacity: 0;
    animation: fadeUp 0.8s ease 0.2s forwards;
  }

  .logo-main {
    font-family: 'Cormorant Garamond', serif;
    font-size: 72px;
    font-weight: 400;
    color: var(--cream);
    line-height: 1;
    letter-spacing: 0.08em;
  }

  .logo-sub {
    font-family: 'Jost', sans-serif;
    font-size: 11px;
    font-weight: 300;
    letter-spacing: 0.35em;
    color: var(--gold);
    text-transform: uppercase;
    margin-top: 6px;
  }

  /* Divider */
  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 24px 0 32px;
    width: 100%;
    opacity: 0;
    animation: fadeUp 0.8s ease 0.3s forwards;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(184,147,58,0.4));
  }
  .divider::after {
    background: linear-gradient(270deg, transparent, rgba(184,147,58,0.4));
  }
  .divider-icon {
    color: var(--gold);
    font-size: 14px;
    opacity: 0.8;
  }

  /* Description */
  .desc {
    font-size: 13px;
    font-weight: 300;
    color: rgba(245,240,232,0.55);
    letter-spacing: 0.08em;
    text-align: center;
    margin-bottom: 36px;
    line-height: 1.7;
    opacity: 0;
    animation: fadeUp 0.8s ease 0.4s forwards;
  }

  /* Buttons */
  .links {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
  }

  .btn {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 22px;
    border-radius: 3px;
    text-decoration: none;
    font-family: 'Jost', sans-serif;
    font-size: 13px;
    font-weight: 400;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    transition: all 0.28s ease;
    position: relative;
    overflow: hidden;
    opacity: 0;
  }

  .btn::before {
    content: '';
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .btn:hover::before { opacity: 1; }
  .btn:hover { transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }

  /* Primary button — terracotta */
  .btn-primary {
    background: var(--terracotta);
    color: var(--cream);
    border: 1px solid rgba(196,98,45,0.5);
    animation: fadeUp 0.7s ease 0.5s forwards;
  }
  .btn-primary::before {
    background: linear-gradient(135deg, rgba(255,255,255,0.08), transparent);
  }
  .btn-primary:hover {
    background: #d06b33;
    box-shadow: 0 8px 24px rgba(196,98,45,0.35);
  }

  /* Secondary buttons */
  .btn-outline {
    background: rgba(245,240,232,0.04);
    color: var(--cream);
    border: 1px solid rgba(245,240,232,0.12);
  }
  .btn-outline::before {
    background: rgba(245,240,232,0.04);
  }
  .btn-outline:hover {
    border-color: rgba(184,147,58,0.4);
    background: rgba(184,147,58,0.06);
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
  }

  /* Gold accent button */
  .btn-gold {
    background: rgba(184,147,58,0.1);
    color: var(--gold);
    border: 1px solid rgba(184,147,58,0.3);
  }
  .btn-gold::before {
    background: rgba(184,147,58,0.06);
  }
  .btn-gold:hover {
    background: rgba(184,147,58,0.18);
    border-color: rgba(184,147,58,0.6);
    box-shadow: 0 4px 16px rgba(184,147,58,0.15);
  }

  /* Staggered animation delays */
  .btn:nth-child(1) { animation: fadeUp 0.7s ease 0.5s forwards; }
  .btn:nth-child(2) { animation: fadeUp 0.7s ease 0.6s forwards; }
  .btn:nth-child(3) { animation: fadeUp 0.7s ease 0.65s forwards; }
  .btn:nth-child(4) { animation: fadeUp 0.7s ease 0.7s forwards; }
  .btn:nth-child(5) { animation: fadeUp 0.7s ease 0.75s forwards; }
  .btn:nth-child(6) { animation: fadeUp 0.7s ease 0.8s forwards; }
  .btn:nth-child(7) { animation: fadeUp 0.7s ease 0.85s forwards; }

  .btn-icon {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .btn-icon svg {
    width: 18px;
    height: 18px;
    fill: currentColor;
  }

  .btn-text { flex: 1; }

  .btn-arrow {
    font-size: 16px;
    opacity: 0.4;
    transition: opacity 0.2s, transform 0.2s;
  }
  .btn:hover .btn-arrow {
    opacity: 0.8;
    transform: translateX(3px);
  }

  /* Footer */
  .footer {
    margin-top: 40px;
    font-size: 11px;
    font-weight: 300;
    letter-spacing: 0.2em;
    color: rgba(245,240,232,0.2);
    text-transform: uppercase;
    text-align: center;
    opacity: 0;
    animation: fadeUp 0.8s ease 1s forwards;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Section label */
  .section-label {
    font-size: 10px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: rgba(184,147,58,0.5);
    text-align: left;
    width: 100%;
    margin-top: 20px;
    margin-bottom: 4px;
    padding-left: 2px;
    opacity: 0;
    animation: fadeUp 0.7s ease 0.58s forwards;
  }
</style>
</head>
<body>
