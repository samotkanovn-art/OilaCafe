<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oila</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mea+Culpa&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --sage: #6b8a52;
    --sage-deep: #4d6639;
    --sage-light: #7d9e62;
    --cream: #f0ede0;
    --cream-dim: rgba(240,237,224,0.55);
    --cream-faint: rgba(240,237,224,0.12);
    --cream-border: rgba(240,237,224,0.18);
    --review-bg: #f0ede0;
    --review-text: #3a4f2a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background-color: var(--sage);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Jost', sans-serif;
  }

  /* Subtle texture overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 90% 50% at 50% -10%, rgba(255,255,255,0.08) 0%, transparent 60%),
      radial-gradient(ellipse 60% 40% at 20% 110%, rgba(0,0,0,0.12) 0%, transparent 60%);
    pointer-events: none;
  }

  /* Grain */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.05'/%3E%3C/svg%3E");
    opacity: 0.35;
    pointer-events: none;
  }

  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 400px;
    padding: 44px 24px 48px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ── Logo ── */
  .logo-wrap {
    text-align: center;
    margin-bottom: 0px;
    opacity: 0;
    animation: fadeUp 0.6s ease 0.1s forwards;
  }

  .logo-anim-wrap {
    display: flex;
    justify-content: center;
  }

  .logo-mask-svg {
    width: 260px;
    height: auto;
    overflow: visible;
  }

  .logo-tagline {
    font-size: 10.5px;
    font-weight: 300;
    letter-spacing: 0.38em;
    color: rgba(240,237,224,0.6);
    text-transform: uppercase;
    margin-top: 12px;
  }


  /* ── Divider ── */
  .divider {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    margin: 22px 0 28px;
    opacity: 0;
    animation: fadeUp 0.9s ease 0.25s forwards;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: rgba(240,237,224,0.25);
  }
  .divider-dot {
    width: 4px; height: 4px;
    border-radius: 50%;
    background: rgba(240,237,224,0.4);
  }

  /* ── Buttons ── */
  .links {
    display: flex;
    flex-direction: column;
    gap: 11px;
    width: 100%;
  }

  .section-gap { margin-top: 10px; }

  .btn {
    display: flex;
    align-items: center;
    gap: 13px;
    padding: 15px 20px;
    border-radius: 4px;
    text-decoration: none;
    font-family: 'Jost', sans-serif;
    font-size: 12.5px;
    font-weight: 400;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    transition: transform 0.22s ease, box-shadow 0.22s ease, background 0.22s ease;
    opacity: 0;
  }

  .btn:hover { transform: translateY(-2px); }
  .btn:active { transform: translateY(0); }

  /* Review button — cream, stands out */
  .btn-review {
    background: var(--cream);
    color: var(--review-text);
    border: none;
    font-weight: 500;
    animation: fadeUp 0.7s ease 0.35s forwards;
  }
  .btn-review:hover {
    background: #f7f4ea;
    box-shadow: 0 8px 24px rgba(0,0,0,0.18);
  }

  /* Telegram — deep sage */
  .btn-tg {
    background: var(--sage-deep);
    color: var(--cream);
    border: 1px solid rgba(240,237,224,0.15);
    animation: fadeUp 0.7s ease 0.45s forwards;
  }
  .btn-tg:hover {
    background: #3e5429;
    box-shadow: 0 6px 20px rgba(0,0,0,0.2);
  }

  /* Outline buttons */
  .btn-outline {
    background: rgba(240,237,224,0.08);
    color: var(--cream);
    border: 1px solid var(--cream-border);
  }
  .btn-outline:hover {
    background: rgba(240,237,224,0.14);
    box-shadow: 0 4px 14px rgba(0,0,0,0.15);
  }

  .btn:nth-child(3) { animation: fadeUp 0.7s ease 0.52s forwards; }
  .btn:nth-child(4) { animation: fadeUp 0.7s ease 0.58s forwards; }
  .btn:nth-child(5) { animation: fadeUp 0.7s ease 0.64s forwards; }
  .btn:nth-child(6) { animation: fadeUp 0.7s ease 0.70s forwards; }

  .btn-icon {
    width: 20px; height: 20px;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .btn-icon svg { width: 17px; height: 17px; fill: currentColor; }

  .btn-text { flex: 1; }

  .btn-arrow {
    font-size: 15px;
    opacity: 0.35;
    transition: opacity 0.2s, transform 0.2s;
  }
  .btn:hover .btn-arrow { opacity: 0.7; transform: translateX(3px); }

  /* ── Footer / geo ── */
  .footer {
    margin-top: 36px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    opacity: 0;
    animation: fadeUp 0.8s ease 0.9s forwards;
  }

  .footer-geo {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 300;
    letter-spacing: 0.22em;
    color: rgba(240,237,224,0.35);
    text-transform: uppercase;
    text-decoration: none;
    transition: color 0.2s;
  }
  .footer-geo:hover { color: rgba(240,237,224,0.65); }
  .footer-geo svg { width: 11px; height: 11px; fill: currentColor; opacity: 0.6; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
